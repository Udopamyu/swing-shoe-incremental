<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#081427">
<meta name="description" content="二重振り子ブランコ靴飛ばし INCREMENTAL。靴を飛ばしてポイントを集め、8種類のアップグレードで最強のブランコを育てよう。">
<title>二重振り子ブランコ靴飛ばし — INCREMENTAL v2.5</title>
<style>
:root{color-scheme:dark;--bg:#081427;--cyan:#71e7ee;--orange:#ffab71;--text:#f2f8ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
body{background:var(--bg);overscroll-behavior:none}
.shell{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;padding:0;display:block;overflow:hidden}
.stage{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#132941;border:0;border-radius:0;box-shadow:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.controls{position:absolute;z-index:3;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(620px,calc(100% - 28px));transition:opacity .2s}
.controls.hidden{visibility:hidden;pointer-events:none}
button,a.share{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.action{height:76px;border:0;border-radius:18px;font-size:clamp(20px,3.7vw,28px);font-weight:900;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 7px 0 #0004,0 12px 22px #0004;transition:transform .12s,filter .14s,opacity .14s}
.action:active:not(:disabled){transform:translateY(4px);box-shadow:0 3px 0 #0004}
.pump{background:linear-gradient(150deg,#91f3f4,#39cede);color:#062a36}
.shoot{background:linear-gradient(150deg,#ffca96,#ff995b);color:#4b2214}
.action:disabled{opacity:.28;filter:grayscale(.7);cursor:default;box-shadow:0 4px 14px #0003}
.count{font-size:13px;font-weight:850;opacity:.68;min-width:40px;white-space:nowrap}
.result-overlay{position:absolute;z-index:4;inset:0;display:flex;align-items:center;justify-content:center;padding:15px;background:#0613246b;backdrop-filter:blur(1.5px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility .25s ease}
.result-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
.result-card{width:min(420px,94%);padding:24px 22px 22px;border:1px solid #acd1ec57;border-radius:22px;background:#0a1b31e8;box-shadow:0 14px 60px #061121aa;text-align:center;display:flex;flex-direction:column;align-items:center;gap:15px}
.result-distance{font-size:clamp(36px,7vw,62px);font-weight:950;letter-spacing:-.045em;color:#ffc08a;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.record{color:#89fff1;font-size:13px;font-weight:900;letter-spacing:.18em}
.record[hidden]{display:none}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%}
.result-actions a,.result-actions button{display:flex;align-items:center;justify-content:center;min-height:56px;border:0;border-radius:12px;text-decoration:none;font-size:15px;font-weight:850;white-space:nowrap;transition:transform .1s,filter .14s}
.result-actions a:active,.result-actions button:active{transform:scale(.975)}
.share{background:#edf7ff;color:#06111e}
.again{background:#ffb27c;color:#3b1e12}
.result-actions a:hover,.result-actions button:hover{filter:brightness(1.08)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:700px){
 .controls{gap:10px;width:calc(100% - 26px);bottom:calc(14px + env(safe-area-inset-bottom,0px))}
 .action{height:70px;border-radius:14px;font-size:21px;gap:8px}
 .count{font-size:12px}
 .result-card{padding:15px 13px;gap:9px;border-radius:15px}
 .result-distance{font-size:clamp(32px,9vw,46px)}
 .result-actions{gap:8px}
 .result-actions a,.result-actions button{min-height:45px;font-size:13px}
}
@media(max-height:530px) and (orientation:landscape){
 .controls{width:min(520px,calc(100% - 28px));bottom:calc(7px + env(safe-area-inset-bottom,0px))}
 .action{height:54px}
 .result-card{padding:12px;gap:8px}
}

/* Incremental edition: full-size canvas, shop overlays only between attempts */
:root{--cyan:#65e2e6;--gold:#ffcc78;--panel:#0b1d32f5}
.hud{position:absolute;z-index:3;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;justify-content:center;gap:10px;pointer-events:none;max-width:calc(100vw - 22px);width:max-content}
.hud-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid #b7d4ef34;border-radius:12px;background:#09192be6;box-shadow:0 7px 28px #0003;white-space:nowrap;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.hud-item .h-label{font-size:11px;font-weight:700;color:#93b6c8}
.hud-item strong{color:#ffd087;font-size:19px}
.hud.is-hidden{display:none}
.controls{bottom:calc(18px + env(safe-area-inset-bottom,0px))}

.result-tag{font-weight:900;letter-spacing:.2em;color:#74e5e2;font-size:12px}
.result-reward{width:100%;padding:14px;background:#142d40;border:1px solid #426070;border-radius:13px;display:flex;align-items:center;justify-content:space-between;gap:9px;text-align:left}
.result-reward .mini{font-size:12px;color:#9cc2d5}
.result-reward strong{font-size:28px;line-height:1;color:#ffd184;font-variant-numeric:tabular-nums}
.result-reward .sub{font-size:11px;color:#9ac0c9}
.result-actions{grid-template-columns:1fr 1fr;gap:10px}
.result-actions .visit-shop{background:linear-gradient(135deg,#83eddf,#48bad6);color:#062f3b}
.result-actions .again{background:#ffb27c;color:#3b1e12}
.result-actions .share{grid-column:1/-1;min-height:43px;background:#e8f5ff;color:#102237}
.shop-overlay{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:clamp(10px,2vw,28px);background:#04101ed9;backdrop-filter:blur(9px)}
.shop-overlay.show{display:flex}
.shop-panel{width:min(1110px,100%);max-height:100%;max-height:calc(100dvh - 24px);display:flex;flex-direction:column;overflow:hidden;border-radius:22px;border:1px solid #78aec955;background:linear-gradient(155deg,#0d253c,#081827 72%);box-shadow:0 30px 90px #0009}
.shop-header{padding:23px 26px 17px;display:flex;justify-content:space-between;align-items:start;gap:16px;border-bottom:1px solid #668b9e31}
.shop-kicker{margin:0 0 5px;color:#6ee4e9;font-size:11px;font-weight:900;letter-spacing:.24em}
.shop-header h1{font-size:clamp(18px,2.25vw,28px);line-height:1.3;font-weight:950;letter-spacing:-.02em;margin:0}
.shop-description{margin:5px 0 0;color:#9ab5cb;font-size:12px}
.shop-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.meta-pill{border:1px solid #426680;background:#142d41;padding:8px 12px;border-radius:12px;text-align:center;min-width:97px}
.meta-pill small{display:block;font-size:10px;letter-spacing:.05em;color:#9fbec9;font-weight:800;margin-bottom:3px}
.meta-pill strong{display:block;font-size:20px;color:#ffd28a;font-variant-numeric:tabular-nums;white-space:nowrap}
.shop-scroll{overflow-y:auto;overscroll-behavior:contain;padding:17px 24px 26px;scrollbar-color:#42647d #0c2236}
.shop-section-label{font-size:12px;color:#92adc4;letter-spacing:.12em;font-weight:900;margin:0 0 12px}
.upgrade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.upgrade-card{display:flex;flex-direction:column;gap:6px;border-radius:15px;background:#153148a8;border:1px solid #6b95ab30;padding:14px 15px;transition:border-color .18s,background .18s}
.upgrade-card.affordable{border-color:#5bd7be80;background:#163e4ca6}
.upgrade-top{display:flex;align-items:center;gap:9px;justify-content:space-between}
.upgrade-name{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900}
.upgrade-glyph{display:flex;width:33px;height:33px;align-items:center;justify-content:center;border-radius:10px;background:#1c4a62;color:#7ce5f1;font-size:16px;font-weight:950;flex:0 0 auto}
.upgrade-level{font-size:11px;font-weight:850;padding:5px 8px;border-radius:20px;background:#284357;color:#c4dbe6;white-space:nowrap}
.upgrade-description{font-size:12px;color:#9fbbcd;line-height:1.4;min-height:17px}
.upgrade-bottom{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:auto;padding-top:5px}
.upgrade-stats{font-size:12px;line-height:1.35;color:#dceef4;font-variant-numeric:tabular-nums}
.upgrade-stats span{color:#7ddfdb;font-weight:850}
.buy-btn{border:1px solid #506e81;background:#233c50;color:#a8c1d1;padding:11px 12px;border-radius:10px;font-size:12px;font-weight:900;white-space:nowrap;min-width:98px}
.buy-btn.can-buy{border-color:#57d8bd;background:#64e7d3;color:#063443;box-shadow:0 2px 13px #34c8ae18}
.buy-btn:disabled{opacity:.65;cursor:not-allowed}
.buy-btn:not(:disabled):active{transform:scale(.97)}
.shop-footer{padding:14px 25px 19px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid #668b9e36;background:#0b1e2f}
.shop-info{font-size:12px;color:#8caec0;line-height:1.45;max-width:50ch}
.shop-buttons{display:flex;align-items:center;gap:12px;flex-shrink:0}
.start-btn{border:0;border-radius:14px;background:linear-gradient(120deg,#ffc888,#ff995d);color:#4a2517;font-size:18px;font-weight:950;padding:14px 30px;min-width:190px;box-shadow:0 5px 0 #88491e,0 10px 19px #0004}
.start-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #88491e}
.erase-btn{border:0;background:transparent;color:#789caf;padding:6px;font-size:11px;text-decoration:underline}
.shop-toast{font-size:12px;color:#69efbe;min-height:15px;align-self:center}
@media(max-width:700px){
 .hud{top:calc(9px + env(safe-area-inset-top,0px));gap:6px}
 .hud-item{font-size:12px;padding:6px 9px;gap:5px}
 .hud-item .h-label{font-size:10px}.hud-item strong{font-size:15px}
 .shop-overlay{padding:0;align-items:stretch}
 .shop-panel{border-radius:0;max-height:100dvh;height:100dvh;border:0}
 .shop-header{padding:calc(13px + env(safe-area-inset-top,0px)) 16px 12px;flex-direction:column;gap:10px}
 .shop-header h1{font-size:18px}.shop-description{font-size:11px}
 .shop-meta{justify-content:flex-start;width:100%}.meta-pill{flex:1;min-width:0;padding:5px 9px}
 .meta-pill strong{font-size:17px}
 .shop-scroll{padding:12px 12px 20px}
 .upgrade-grid{grid-template-columns:1fr;gap:9px}
 .upgrade-card{padding:11px 12px;gap:4px}
 .upgrade-name{font-size:14px}.upgrade-description{font-size:11px}
 .shop-footer{padding:11px 12px calc(13px + env(safe-area-inset-bottom,0px));gap:8px;flex-wrap:wrap}
 .shop-info{font-size:10px;max-width:100%;width:100%}
 .shop-buttons{width:100%;justify-content:space-between}
 .start-btn{font-size:16px;min-width:0;padding:12px 22px;flex:1}
 .erase-btn{flex:0 0 auto}
 .result-card{padding:18px 14px 16px}.result-distance{font-size:clamp(32px,9vw,51px)}
}
@media(max-height:560px) and (min-width:701px){
 .shop-header{padding:10px 18px}.shop-scroll{padding:10px 18px}.shop-footer{padding:8px 18px}
 .upgrade-card{padding:9px 11px}.upgrade-grid{gap:8px}
}


/* V2.5: restrained arcade HUD and compact eight-item upgrade grid */
.hud{left:16px;top:calc(13px + env(safe-area-inset-top,0px));transform:none;}
.hud-item{padding:7px 11px;gap:5px;border-radius:12px;background:#081b2bc0;border-color:#9cb9c33b}
.hud-item strong{font-size:18px;color:#ffcd7e}.hud-item .h-label{font-size:12px;color:#ffcd7e}
input[type=range]{accent-color:#70e7d9;cursor:pointer;touch-action:pan-x}
.result-card{width:min(390px,94%);gap:15px;padding:27px 20px}
.result-reward{display:flex;align-items:center;justify-content:center;min-height:58px;padding:8px;background:#173248;border:0}
.result-reward strong{color:#ffcf84;font-size:26px}
.shop-overlay{background:#061529d9}
.shop-panel{width:min(850px,100%);border-radius:18px}
.shop-header{padding:15px 19px;align-items:center;gap:10px}
.shop-header h1{font-size:23px;white-space:nowrap}
.shop-meta{display:flex;align-items:baseline;gap:15px}
.shop-meta strong{font-weight:950;color:#ffcf88;font-size:22px;font-variant-numeric:tabular-nums}
.shop-meta span{font-size:11px;color:#a1b8c7;white-space:nowrap}
.shop-scroll{padding:14px 18px 13px}
.upgrade-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.upgrade-card{gap:10px;padding:13px 14px;background:#19334ac4;border-radius:13px}
.upgrade-card.affordable{background:#1a3b46d4}
.upgrade-top{gap:5px}
.upgrade-name{font-size:14px;gap:7px}
.upgrade-glyph{width:29px;height:29px;border-radius:9px;font-size:15px}
.upgrade-level{font-size:10px;padding:4px 6px}
.upgrade-bottom{padding:0;align-items:center}
.upgrade-stats{line-height:1.2;font-size:12px}
.buy-btn{min-width:84px;font-size:12px;padding:11px 8px}
.length-shop{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;padding:13px 14px;border:1px solid #5b87954d;border-radius:13px;background:#123149}
.length-label{font-size:14px;font-weight:900;white-space:nowrap;color:#c6efed}
.length-shop input{flex:1;min-width:45px}
.length-shop output{min-width:69px;text-align:right;font-variant-numeric:tabular-nums;font-weight:900;color:#ffcf88}
.shop-footer{justify-content:flex-end;padding:13px 18px}
.erase-btn{font-size:21px;text-decoration:none;color:#a2b8c8;padding:8px 14px}
.start-btn{font-size:19px;min-width:160px;padding:13px 28px}
@media(max-width:700px){
 .hud{top:calc(10px + env(safe-area-inset-top,0px));left:10px}
 .hud-item{padding:7px 9px}.hud-item strong{font-size:15px}
 .shop-header{padding:calc(15px + env(safe-area-inset-top,0px)) 12px 11px;flex-direction:row;align-items:center;justify-content:space-between}
 .shop-header h1{font-size:20px}
 .shop-meta{justify-content:flex-end;align-items:end;flex-direction:column;gap:1px}
 .shop-meta strong{font-size:19px}.shop-meta span{font-size:10px}

 .upgrade-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .upgrade-card{padding:10px 9px;gap:9px}
 .upgrade-name{font-size:12px;gap:5px;line-height:1.2}
 .upgrade-glyph{width:25px;height:25px;font-size:13px}
 .upgrade-level{font-size:10px;padding:3px 4px}
 .upgrade-bottom{flex-wrap:wrap;gap:6px}
 .upgrade-stats{font-size:11px;flex:1;min-width:0}
 .buy-btn{padding:8px 7px;font-size:11px;min-width:65px;flex:0 0 auto}
 .length-shop{gap:7px;margin-top:8px;padding:9px 10px}
 .length-label{font-size:12px}.length-shop output{font-size:11px;min-width:52px}
 .shop-footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between}
 .shop-buttons{display:none}
 .start-btn{flex:0 1 auto;min-width:145px;font-size:16px;padding:11px 20px}

}
@media(max-width:345px){.upgrade-grid{grid-template-columns:1fr}.upgrade-bottom{flex-wrap:nowrap}}
@media(max-height:690px) and (min-width:701px){.shop-scroll{padding:10px 15px}.upgrade-card{padding:9px 11px;gap:6px}.upgrade-grid{gap:7px}.length-shop{margin-top:8px;padding:9px 12px}.shop-header{padding:11px 18px}}

/* v2.3: shop accessible after immediate gameplay start */
.hud{pointer-events:auto;align-items:stretch;}
.open-shop{display:flex;align-items:center;justify-content:center;min-width:38px;padding:4px 12px;border-radius:12px;border:1px solid #8eb7cc66;background:#0a2138dc;color:#8ef4df;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 5px 18px #07142266}
.open-shop:active{transform:translateY(2px)}
@media(max-width:700px){.open-shop{min-width:35px;font-size:21px;padding:3px 9px}}
</style>
</head>
<body>
<main class="shell">
  <section class="stage" aria-label="二重振り子ブランコ靴飛ばし">
    <canvas id="game" width="960" height="540" aria-label="ブランコと靴の動くゲーム画面"></canvas>
    <div class="hud" id="hud"><div class="hud-item"><strong id="hudPoints">0</strong><span class="h-label">P</span></div><button id="openShop" class="open-shop" type="button" aria-label="強化画面を開く" title="強化">↑</button></div>
    <div class="result-overlay" id="result" aria-live="polite" aria-hidden="true">
      <div class="result-card">
        <div id="newRecord" class="record" hidden>NEW BEST!</div>
        <div id="resultDistance" class="result-distance">0.00 m</div>
        <div class="result-reward"><strong id="resultReward">+0 P</strong></div>
        <div class="result-actions">
          <button id="visitShop" class="visit-shop" type="button">強化</button>
          <button id="again" class="again" type="button">もう一度</button>
          <a id="share" class="share" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener noreferrer">𝕏 で共有</a>
        </div>
      </div>
    </div>
  </section>
  <div class="controls" id="controls">
    <button id="pump" class="action pump" type="button" aria-label="漕ぐ"><span>漕ぐ</span><span class="count" id="strokeCount">0/5</span></button>
    <button id="throw" class="action shoot" type="button" disabled>射出</button>
  </div>
  <div class="shop-overlay" id="shop" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <div class="shop-panel">
      <header class="shop-header">
        <h1 id="shopTitle">強化</h1>
        <div class="shop-meta"><strong id="shopPoints">0 P</strong><span id="shopBest">BEST 0.00 m</span></div>
      </header>
      <div class="shop-scroll" id="shopScroll">
        <div class="upgrade-grid" id="upgradeGrid"></div>
        <div class="length-shop">
          <span class="length-label">↕ 長さ</span>
          <input id="lengthInShop" type="range" min="2" max="3.45" step="0.05" value="3.45" aria-label="使用するブランコの長さ">
          <output id="shopLengthValue" for="lengthInShop">3.45 m</output>
        </div>
      </div>
      <footer class="shop-footer">
        <button class="erase-btn" id="eraseSave" type="button" title="セーブデータ初期化">↺</button>
        <button class="start-btn" id="startGame" type="button">プレイ ▶</button>
      </footer>
    </div>
  </div>
  <p class="sr-only">スペースキーで漕ぐ。いつでもEnterキーで射出。Rキーで再挑戦。</p>
</main>
<script>

(()=>{'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const BASE_W=960,BASE_H=540, TAU=Math.PI*2;
let W=BASE_W,H=BASE_H;
const PH={l1:2.28,l2:2.10,leg:.38,m1:6.00,m2:1.80,g:9.81,h:5.35,d1:.14,d2:.08,air1:.12,air2:.04,pumpForce:66,strokeTime:.24,maxStrokeWork:34,energyScale:145,footKick:2.40};
let MAX=5,SCALE=74;
// Fresh economy: keep older incremental saves intact under their original key.
const SAVE_KEY='swing_shot_incremental_v4', OLD_SAVE_KEY='swing_shot_incremental_v3', LEGACY_SAVE_KEY='swing_shot_incremental_v2';
const OLD_STROKES=[5,10,20,40,65,100];
const UPGRADES=[
 {id:'power',icon:'↗',name:'漕ぐ力',base:12,growth:1.75,max:5},
 {id:'strokes',icon:'＋',name:'漕ぐ回数',base:12,growth:1,max:100},
 {id:'kick',icon:'➤',name:'射出速度',base:18,growth:1.78,max:5},
 {id:'length',icon:'↕',name:'ブランコ長',base:22,growth:1.81,max:5},
 {id:'bonus',icon:'★',name:'P倍率',base:29,growth:1.87,max:5},
 {id:'drag',icon:'≈',name:'空気抵抗',base:18,growth:1.77,max:5},
 {id:'joint',icon:'●',name:'関節軽量',base:22,growth:1.81,max:5},
 {id:'seat',icon:'▱',name:'座面軽量化',base:25,growth:1.82,max:5}
];
function blankSave(){return {points:0,best:0,runs:0,totalEarned:0,length:3.45,levels:Object.fromEntries(UPGRADES.map(u=>[u.id,0]))}}
function loadSave(){let data=null,oldVersion='';
 try{
   data=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
   if(!data){data=JSON.parse(localStorage.getItem(OLD_SAVE_KEY)||'null');oldVersion=data?'v3':''}
   if(!data){data=JSON.parse(localStorage.getItem(LEGACY_SAVE_KEY)||'null');oldVersion=data?'v2':''}

 ctx.beginPath();ctx.arc(-14,-55,17,0,TAU);ctx.fillStyle='#f2c6a4';ctx.fill();
 ctx.beginPath();ctx.arc(-14,-59,17,Math.PI,TAU);ctx.fillStyle='#24334a';ctx.fill();
 ctx.fillStyle='#24334a';ctx.beginPath();ctx.arc(-7,-54,2,0,TAU);ctx.fill();
 ctx.restore();
 // Legs extend beyond the seat; they are not an additional simulated pendulum.
 line(chair.x-5*riderScale,chair.y+1*riderScale,foot.x-5*riderScale,foot.y,'#12465f',11*riderScale);line(chair.x-5*riderScale,chair.y+1*riderScale,foot.x-5*riderScale,foot.y,'#68deda',5*riderScale);
 ctx.beginPath();ctx.arc(chair.x,chair.y,6*riderScale,0,TAU);ctx.fillStyle='#e6c5a2';ctx.fill();
 if(state.phase==='swing')sneaker(foot.x,foot.y,Math.atan2(-Math.sin(b),Math.cos(b))*.35,1.12*riderScale);
 else{ctx.beginPath();ctx.arc(foot.x,foot.y,7*riderScale,0,TAU);ctx.fillStyle='#e9edf5';ctx.fill()}
}
function seatTrace(){const v=state.seatTrail;if(v.length<2)return;
 for(let i=1;i<v.length;i++){const age=state.simTime-v[i].t;if(age>4.0)continue;
 const a=world(v[i-1].x,v[i-1].y),b=world(v[i].x,v[i].y);
 ctx.globalAlpha=.25*(1-age/4);line(a.x,a.y,b.x,b.y,'#58edec',2.1)}ctx.globalAlpha=1
}
function aimArrow(){if(state.phase!=='swing'||state.kick!==MAX)return;
 const p=launchState(),a=world(p.x,p.y),b=world(p.x+p.nx*.68,p.y+p.ny*.68),ang=Math.atan2(b.y-a.y,b.x-a.x);
 line(a.x,a.y,b.x,b.y,'#fff2a0',4);
 for(const d of [-1,1])line(b.x,b.y,b.x-12*Math.cos(ang+d*.52),b.y-12*Math.sin(ang+d*.52),'#fff2a0',3);
}
function throwTrail(){if(!state.shoe)return;const GROUND_Y=groundY();
 let tr=state.trail;
 if(tr.length>1){ctx.beginPath();for(let i=0;i<tr.length;i++){const p=world(tr[i].x,tr[i].y);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)}ctx.setLineDash([5,7]);ctx.lineWidth=2;ctx.strokeStyle='#ffc189a0';ctx.stroke();ctx.setLineDash([])}
 const p=state.shoe,q=world(p.x,p.y),prev=state.phase==='landed'?Math.atan2(p.vy,p.vx):Math.atan2(p.vy,p.vx);sneaker(q.x,state.phase==='landed'?q.y+craterDepthAt(q.x)*.47:q.y,prev*.55,1.15);
 if(state.phase==='landed'){ctx.save();ctx.strokeStyle='#ffe0b4';ctx.lineWidth=2;for(let i=0;i<9;i++){let r=i*Math.PI/4.5;line(q.x+Math.cos(r)*19,q.y-9+Math.sin(r)*7,q.x+Math.cos(r)*28,q.y-12+Math.sin(r)*13,'#ffa45e83',2)}ctx.restore()}
 let from=world(p.startX,PH.h),to=world(p.x,PH.h);if(state.phase==='landed'&&from.x>=0&&from.x<=W&&to.x>=0&&to.x<=W){line(from.x,GROUND_Y-9,to.x,GROUND_Y-9,'#ffa45e75',3)}
}
function render(time){resize();ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(state.shake){ctx.translate((Math.random()-.5)*state.shake,(Math.random()-.5)*state.shake)}backdrop(time);windStreaks();drawVisitors();if(state.phase==='swing'){swingFrame();seatTrace();rider();aimArrow()}else if(state.phase==='flying' || state.phase==='landed'){if(Math.abs(state.cam)<10&&Math.abs(state.camY)<9){swingFrame();seatTrace();rider()}}throwTrail();dustEffect();ctx.restore()}
function tick(ts){if(!lastFrame)lastFrame=ts;let dt=Math.min((ts-lastFrame)/1000,.05);lastFrame=ts;now=ts;
 if(!shopOpen){accumulator+=dt;let n=0;while(accumulator>=1/240&&n<24){step(1/240);accumulator-=1/240;n++}if(n===24)accumulator=0;}
 else accumulator=0;
 render(ts);requestAnimationFrame(tick)}
$('pump').addEventListener('click',pump);
$('openShop').addEventListener('click',showShop);
$('throw').addEventListener('click',shoot);
$('again').addEventListener('click',reset);
$('visitShop').addEventListener('click',showShop);
$('startGame').addEventListener('click',startRound);
$('lengthInShop').addEventListener('input',e=>setSwingLength(e.target.value));
$('eraseSave').addEventListener('click',()=>{
 if(!window.confirm('すべての強化、ポイント、記録を削除しますか？'))return;
 progress=blankSave();saveProgress();applyUpgrades();renderShop();syncLengthControls();
});
window.addEventListener('keydown',e=>{
 if(e.repeat)return;
 if(e.code==='Space'){e.preventDefault();pump()}
 else if(e.code==='Enter'&&state.phase==='swing'){e.preventDefault();shoot()}
 else if(e.code==='KeyR'&&!shopOpen){reset()}
});
window.addEventListener('resize',()=>render(performance.now()));
applyUpgrades();syncLengthControls();reset();updateHud();saveProgress();requestAnimationFrame(tick);
})();
</script>
